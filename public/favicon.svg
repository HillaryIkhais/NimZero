<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NimZero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1830"/>
      <stop offset="1" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ec6e8"/>
      <stop offset="1" stop-color="#32e0a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <!-- zero / ring -->
  <circle cx="256" cy="256" r="146" fill="none" stroke="url(#ring)" stroke-width="46"/>
  <!-- check inside the ring (verified, zero cost) -->
  <path d="M192 262l40 40 88-92" fill="none" stroke="#32e0a1" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>